apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/gitea
  prune: true
  dependsOn:
    - name: cert-manager-config
    - name: cnpg-operator
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m0s
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dawarich
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/dawarich
  prune: true
  dependsOn:
    - name: cert-manager-config
    - name: cnpg-operator
  sourceRef:
    kind: GitRepository
    name: gitea-apps
    namespace: flux-system
  wait: true
  timeout: 5m0s
