apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8up
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: k8up
      version: "4.10.x"
      sourceRef:
        kind: HelmRepository
        name: k8up
        namespace: flux-system
  targetNamespace: k8up-system
  install:
    createNamespace: true
