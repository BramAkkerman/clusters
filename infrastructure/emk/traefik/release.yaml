apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: "41.x"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  targetNamespace: traefik
  install:
    createNamespace: true
  values:
    api:
      insecure: true   # enables the actual /api/* routes on the existing internal "traefik" entrypoint (:8080) for homepage's widget - dashboard=true alone (chart default) doesn't create working API routes on its own. Never exposed externally: this entrypoint isn't in ports.* below, so it's absent from the LoadBalancer Service entirely - see dashboard-service.yaml for the separate ClusterIP-only path that actually reaches it.
    service:
      type: LoadBalancer
    ports:
      gitssh:
        port: 2222
        expose:
          default: true
        exposedPort: 22
        protocol: TCP
      wireguard:
        port: 51820
        expose:
          default: true
        exposedPort: 51820
        protocol: UDP
