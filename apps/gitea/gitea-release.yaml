apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
  namespace: gitea
spec:
  interval: 1h
  chart:
    spec:
      chart: gitea
      version: "12.x"
      sourceRef:
        kind: HelmRepository
        name: gitea
        namespace: gitea
  values:
    strategy:
      type: Recreate   # single ReadWriteOnce volume + local LevelDB queue lock - a RollingUpdate briefly runs old+new pods concurrently, and the new one can't acquire the queue's file lock while the old one still holds it ("unable to lock level db ... resource temporarily unavailable")
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    postgresql:
      enabled: false
    postgresql-ha:
      enabled: false
    valkey:
      enabled: false
    valkey-cluster:
      enabled: false
    persistence:
      enabled: true
      size: 10Gi
    gitea:
      admin:
        existingSecret: gitea-admin   # created manually, see below
      config:
        database:
          DB_TYPE: postgres
          HOST: postgresql-rw.gitea.svc.cluster.local:5432
          NAME: gitea
          USER: gitea
      additionalConfigFromEnvs:
        - name: GITEA__database__PASSWD
          valueFrom:
            secretKeyRef:
              name: postgresql-auth
              key: password
    ingress:
      enabled: true
      className: traefik-traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: git.meneerak.nl
          paths:
            - path: /
      tls:
        - secretName: gitea-tls
          hosts:
            - git.meneerak.nl
