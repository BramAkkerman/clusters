apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
  namespace: zitadel
spec:
  instances: 1
  storage:
    size: 10Gi
  enableSuperuserAccess: true
  superuserSecret:
    name: postgresql-superuser
  bootstrap:
    initdb:
      database: zitadel
      owner: zitadel
      secret:
        name: postgresql-auth