apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
  namespace: zitadel
spec:
  interval: 1h
  chart:
    spec:
      chart: zitadel
      version: "8.x"
      sourceRef:
        kind: HelmRepository
        name: zitadel
        namespace: flux-system
  install:
    remediation:
      retries: 3
  values:
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        cpu: 500m
        memory: 384Mi
    init:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
    setup:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
    zitadel:
      masterkeySecretName: zitadel-masterkey   # created manually, see below
      configmapConfig:
        ExternalDomain: auth.meneerak.nl
        ExternalPort: 443
        ExternalSecure: true
        TLS:
          Enabled: false
        DefaultInstance:
          SMTPConfiguration:
            SMTP:
              Host: send.pidge.cyso.cloud:587
              User: braml+513b98df@pidge
            TLS: true
            From: noreply@meneerak.nl
          DomainPolicy:
            SMTPSenderAddressMatchesInstanceDomain: false
        Database:
          Postgres:
            Host: postgresql-rw.zitadel.svc.cluster.local
            Port: 5432
            Database: zitadel
            User:
              Username: zitadel
              SSL:
                Mode: disable
            Admin:
              Username: postgres
              SSL:
                Mode: disable
    env:
      - name: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
        valueFrom:
          secretKeyRef:
            name: postgresql-auth
            key: password
      - name: ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: postgresql-superuser
            key: password
      - name: ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_PASSWORD
        valueFrom:
          secretKeyRef:
            name: zitadel-smtp
            key: password
      - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: zitadel-admin
            key: password
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: auth.meneerak.nl
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: zitadel-tls
          hosts:
            - auth.meneerak.nl