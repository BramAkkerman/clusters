apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: zitadel
spec:
  interval: 1h
  chart:
    spec:
      chart: postgresql
      version: "16.x"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    auth:
      username: zitadel
      database: zitadel
      existingSecret: postgresql-auth   # created manually, see below
    primary:
      persistence:
        enabled: true
        size: 10Gi